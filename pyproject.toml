[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=1.7.0",
    "jupyter>=1.1.1",
    "langchain-community==0.3.27",
    "llama-index>=0.14.25",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-llms-groq>=0.6.1",
    "llama-index-vector-stores-chroma>=0.6.0",
    "openai>=2.54.0",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "ragas==0.2.15",
    "streamlit>=1.65.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
